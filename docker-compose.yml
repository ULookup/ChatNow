services:
  etcd:
    image: quay.io/coreos/etcd:v3.4.30
    container_name: etcd-service
    environment:
      - ETCD_NAME=etcd-s1
      - ETCD_DATA_DIR=/var/lib/etcd
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
    volumes:
      - ./middle/data/etcd:/var/lib/etcd:rw
    ports:
      - "127.0.0.1:2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: always
  mysql:
    image: mysql:8.0.44
    container_name: mysql-service
    environment:
      MYSQL_ROOT_PASSWORD: ${CHATNOW_MYSQL_ROOT_PASSWORD:?CHATNOW_MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: chatnow
    volumes:
      - ./middle/data/mysql:/var/lib/mysql:rw
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --silent"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s
    restart: always
  mysql-init:
    image: mysql:8.0.44
    container_name: chatnow-mysql-init
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${CHATNOW_MYSQL_ROOT_PASSWORD:?CHATNOW_MYSQL_ROOT_PASSWORD is required}
      CHATNOW_IDENTITY_MYSQL_PASSWORD: ${CHATNOW_IDENTITY_MYSQL_PASSWORD:?CHATNOW_IDENTITY_MYSQL_PASSWORD is required}
      CHATNOW_CONVERSATION_MYSQL_PASSWORD: ${CHATNOW_CONVERSATION_MYSQL_PASSWORD:?CHATNOW_CONVERSATION_MYSQL_PASSWORD is required}
      CHATNOW_RELATIONSHIP_MYSQL_PASSWORD: ${CHATNOW_RELATIONSHIP_MYSQL_PASSWORD:?CHATNOW_RELATIONSHIP_MYSQL_PASSWORD is required}
      CHATNOW_MESSAGE_MYSQL_PASSWORD: ${CHATNOW_MESSAGE_MYSQL_PASSWORD:?CHATNOW_MESSAGE_MYSQL_PASSWORD is required}
      CHATNOW_MEDIA_MYSQL_PASSWORD: ${CHATNOW_MEDIA_MYSQL_PASSWORD:?CHATNOW_MEDIA_MYSQL_PASSWORD is required}
    volumes:
      - ./sql:/migrations:ro
      - ./scripts/init_mysql.sh:/init/init_mysql.sh:ro
      - ./scripts/converge_mysql_users.sh:/init/converge_mysql_users.sh:ro
    entrypoint: /bin/bash -c "exec /init/init_mysql.sh"
    restart: "no"
  redis-node1:
    image: redis:7.2.5
    container_name: redis-node1
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis-node1 --cluster-preferred-endpoint-type hostname --appendonly yes --appendfilename appendonly-1.aof
    volumes:
      - ./middle/data/redis/node1:/data:rw
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: always

  redis-node2:
    image: redis:7.2.5
    container_name: redis-node2
    command: redis-server --port 6380 --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis-node2 --cluster-preferred-endpoint-type hostname --appendonly yes --appendfilename appendonly-2.aof
    volumes:
      - ./middle/data/redis/node2:/data:rw
    ports:
      - "127.0.0.1:6380:6380"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: always

  redis-node3:
    image: redis:7.2.5
    container_name: redis-node3
    command: redis-server --port 6381 --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis-node3 --cluster-preferred-endpoint-type hostname --appendonly yes --appendfilename appendonly-3.aof
    volumes:
      - ./middle/data/redis/node3:/data:rw
    ports:
      - "127.0.0.1:6381:6381"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6381", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: always

  redis-node4:
    image: redis:7.2.5
    container_name: redis-node4
    command: redis-server --port 6382 --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis-node4 --cluster-preferred-endpoint-type hostname --appendonly yes --appendfilename appendonly-4.aof
    volumes:
      - ./middle/data/redis/node4:/data:rw
    ports:
      - "127.0.0.1:6382:6382"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6382", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: always

  redis-node5:
    image: redis:7.2.5
    container_name: redis-node5
    command: redis-server --port 6383 --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis-node5 --cluster-preferred-endpoint-type hostname --appendonly yes --appendfilename appendonly-5.aof
    volumes:
      - ./middle/data/redis/node5:/data:rw
    ports:
      - "127.0.0.1:6383:6383"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6383", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: always

  redis-node6:
    image: redis:7.2.5
    container_name: redis-node6
    command: redis-server --port 6384 --cluster-enabled yes --cluster-config-file /data/nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname redis-node6 --cluster-preferred-endpoint-type hostname --appendonly yes --appendfilename appendonly-6.aof
    volumes:
      - ./middle/data/redis/node6:/data:rw
    ports:
      - "127.0.0.1:6384:6384"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6384", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: always

  redis-cluster-init:
    image: redis:7.2.5
    container_name: redis-cluster-init
    depends_on:
      redis-node1:
        condition: service_healthy
      redis-node2:
        condition: service_healthy
      redis-node3:
        condition: service_healthy
      redis-node4:
        condition: service_healthy
      redis-node5:
        condition: service_healthy
      redis-node6:
        condition: service_healthy
    volumes:
      - ./scripts/init_redis_cluster.sh:/init/init_redis_cluster.sh:ro
    entrypoint: /bin/sh -c "REDIS_INIT_MAX_ATTEMPTS=60 exec /init/init_redis_cluster.sh"
    restart: "no"
  elasticsearch:
    image: elasticsearch:7.17.21
    container_name: elasticsearch-service
    environment:
      - "discovery.type=single-node"
    volumes:
      - ./middle/data/elasticsearch:/var/lib/elasticsearch:rw
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 10s
    restart: always
  rabbitmq:
    image: rabbitmq:3.12.1-management
    container_name: rabbitmq-service
    hostname: rabbitmq
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_DEFAULT_USER: ${CHATNOW_RABBITMQ_BOOTSTRAP_USER:-chatnow_bootstrap}
      RABBITMQ_DEFAULT_PASS: ${CHATNOW_RABBITMQ_BOOTSTRAP_PASSWORD:?CHATNOW_RABBITMQ_BOOTSTRAP_PASSWORD is required}
    volumes:
      - ./middle/data/rabbitmq:/var/lib/rabbitmq:rw
    ports:
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    restart: always
  rabbitmq-init:
    image: rabbitmq:3.12.1-management
    container_name: rabbitmq-init
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_INIT_MAX_ATTEMPTS: 60
      RABBITMQ_BOOTSTRAP_USER: ${CHATNOW_RABBITMQ_BOOTSTRAP_USER:-chatnow_bootstrap}
      RABBITMQ_BOOTSTRAP_PASSWORD: ${CHATNOW_RABBITMQ_BOOTSTRAP_PASSWORD:?CHATNOW_RABBITMQ_BOOTSTRAP_PASSWORD is required}
      CHATNOW_TRANSMITE_MQ_PASSWORD: ${CHATNOW_TRANSMITE_MQ_PASSWORD:?CHATNOW_TRANSMITE_MQ_PASSWORD is required}
      CHATNOW_MESSAGE_MQ_PASSWORD: ${CHATNOW_MESSAGE_MQ_PASSWORD:?CHATNOW_MESSAGE_MQ_PASSWORD is required}
      CHATNOW_PUSH_MQ_PASSWORD: ${CHATNOW_PUSH_MQ_PASSWORD:?CHATNOW_PUSH_MQ_PASSWORD is required}
    volumes:
      - ./scripts/init_rabbitmq.py:/init/init_rabbitmq.py:ro
    entrypoint: python3 /init/init_rabbitmq.py
    restart: "no"
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: chatnow-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CHATNOW_MINIO_ROOT_USER:?CHATNOW_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${CHATNOW_MINIO_ROOT_PASSWORD:?CHATNOW_MINIO_ROOT_PASSWORD is required}
    volumes:
      - ./middle/data/minio:/data:rw
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 2s
      retries: 40
      start_period: 5s
    restart: always
  minio-init:
    build: docker/minio-init
    image: chatnow-minio-init:local
    container_name: chatnow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${CHATNOW_MINIO_ROOT_USER:?CHATNOW_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${CHATNOW_MINIO_ROOT_PASSWORD:?CHATNOW_MINIO_ROOT_PASSWORD is required}
      MINIO_APP_ACCESS_KEY: ${CHATNOW_MEDIA_S3_ACCESS_KEY:?CHATNOW_MEDIA_S3_ACCESS_KEY is required}
      MINIO_APP_SECRET_KEY: ${CHATNOW_MEDIA_S3_SECRET_KEY:?CHATNOW_MEDIA_S3_SECRET_KEY is required}
      MINIO_INIT_MAX_ATTEMPTS: 60
    restart: "no"
  media_server:
    build: ./media
    container_name: media_server-service
    environment:
      CHATNOW_MEDIA_MYSQL_PASSWORD: ${CHATNOW_MEDIA_MYSQL_PASSWORD:?CHATNOW_MEDIA_MYSQL_PASSWORD is required}
      CHATNOW_MEDIA_S3_ACCESS_KEY: ${CHATNOW_MEDIA_S3_ACCESS_KEY:?CHATNOW_MEDIA_S3_ACCESS_KEY is required}
      CHATNOW_MEDIA_S3_SECRET_KEY: ${CHATNOW_MEDIA_S3_SECRET_KEY:?CHATNOW_MEDIA_S3_SECRET_KEY is required}
    volumes:
      - ./conf/docker/media_server.conf:/im/conf/media_server.conf:ro
      - ./conf/docker/media.json:/im/conf/media.json:ro
      - ./middle/data/logs:/var/lib/logs:rw
      - ./middle/data/data:/var/lib/data:rw
      - ./entrypoint.sh:/im/bin/entrypoint.sh
    ports:
      - 10002:10002
    restart: always
    depends_on:
      etcd:
        condition: service_healthy
      mysql-init:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    entrypoint:
      /im/bin/entrypoint.sh -d etcd:2379,mysql:3306,redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384,minio:9000 -c "/im/bin/media_server -flagfile=/im/conf/media_server.conf -mysql_user=chatnow_media -redis_seeds=redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384"
  relationship_server:
    build: ./relationship
    container_name: relationship_server-service
    environment:
      CHATNOW_RELATIONSHIP_MYSQL_PASSWORD: ${CHATNOW_RELATIONSHIP_MYSQL_PASSWORD:?CHATNOW_RELATIONSHIP_MYSQL_PASSWORD is required}
    volumes:
      - ./conf/docker/relationship_server.conf:/im/conf/relationship_server.conf
      - ./middle/data/logs:/var/lib/logs:rw
      - ./middle/data/data:/var/lib/data:rw
      - ./entrypoint.sh:/im/bin/entrypoint.sh
    ports:
      - 10006:10006
    restart: always
    depends_on:
      etcd:
        condition: service_healthy
      mysql-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    entrypoint:
      /im/bin/entrypoint.sh -d etcd:2379,mysql:3306,elasticsearch:9200 -c "/im/bin/relationship_server -flagfile=/im/conf/relationship_server.conf -mysql_user=chatnow_relationship"
  conversation_server:
    build: ./conversation
    container_name: conversation_server-service
    environment:
      CHATNOW_CONVERSATION_MYSQL_PASSWORD: ${CHATNOW_CONVERSATION_MYSQL_PASSWORD:?CHATNOW_CONVERSATION_MYSQL_PASSWORD is required}
    volumes:
      - ./conf/docker/conversation_server.conf:/im/conf/conversation_server.conf
      - ./middle/data/logs:/var/lib/logs:rw
      - ./middle/data/data:/var/lib/data:rw
      - ./entrypoint.sh:/im/bin/entrypoint.sh
    ports:
      - 10007:10007
    restart: always
    depends_on:
      etcd:
        condition: service_healthy
      mysql-init:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    entrypoint:
      /im/bin/entrypoint.sh -d etcd:2379,mysql:3306,redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384,elasticsearch:9200 -c "/im/bin/conversation_server -flagfile=/im/conf/conversation_server.conf -mysql_user=chatnow_conversation -redis_seeds=redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384"
  gateway_server:
    build: ./gateway
    container_name: gateway_server-service
    environment:
      CHATNOW_JWT_CONFIG: ${CHATNOW_JWT_CONFIG:?CHATNOW_JWT_CONFIG is required}
    volumes:
      - ./conf/docker/gateway_server.conf:/im/conf/gateway_server.conf
      - ./middle/data/logs:/var/lib/logs:rw
      - ./middle/data/data:/var/lib/data:rw
      - ./entrypoint.sh:/im/bin/entrypoint.sh
    ports:
      - 9000:9000
    restart: always
    depends_on:
      etcd:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    entrypoint:
      /im/bin/entrypoint.sh -d etcd:2379,redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384 -c "/im/bin/gateway_server -flagfile=/im/conf/gateway_server.conf -redis_seeds=redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384"
  push_server:
    build: ./push
    container_name: push_server-service
    environment:
      CHATNOW_JWT_CONFIG: ${CHATNOW_JWT_CONFIG:?CHATNOW_JWT_CONFIG is required}
      CHATNOW_PUSH_MQ_PASSWORD: ${CHATNOW_PUSH_MQ_PASSWORD:?CHATNOW_PUSH_MQ_PASSWORD is required}
    volumes:
      - ./conf/docker/push_server.conf:/im/conf/push_server.conf
      - ./middle/data/logs:/var/lib/logs:rw
      - ./middle/data/data:/var/lib/data:rw
      - ./entrypoint.sh:/im/bin/entrypoint.sh
    ports:
      - 10008:10008
      - 9001:9001
    restart: always
    depends_on:
      etcd:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
    entrypoint:
      /im/bin/entrypoint.sh -d etcd:2379,redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384,rabbitmq:5672 -c "/im/bin/push_server -flagfile=/im/conf/push_server.conf -mq_user=chatnow_push -redis_seeds=redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384"
  message_server:
    build: ./message
    container_name: message_server-service
    environment:
      CHATNOW_MESSAGE_MYSQL_PASSWORD: ${CHATNOW_MESSAGE_MYSQL_PASSWORD:?CHATNOW_MESSAGE_MYSQL_PASSWORD is required}
      CHATNOW_MESSAGE_MQ_PASSWORD: ${CHATNOW_MESSAGE_MQ_PASSWORD:?CHATNOW_MESSAGE_MQ_PASSWORD is required}
    volumes:
      - ./conf/docker/message_server.conf:/im/conf/message_server.conf
      - ./middle/data/logs:/var/lib/logs:rw
      - ./middle/data/data:/var/lib/data:rw
      - ./entrypoint.sh:/im/bin/entrypoint.sh
    ports:
      - 10005:10005
    restart: always
    depends_on:
      etcd:
        condition: service_healthy
      mysql-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
    entrypoint:
      /im/bin/entrypoint.sh -d etcd:2379,mysql:3306,redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384,elasticsearch:9200,rabbitmq:5672 -c "/im/bin/message_server -flagfile=/im/conf/message_server.conf -mysql_user=chatnow_message -mq_user=chatnow_message -redis_seeds=redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384"
  transmite_server:
    build: ./transmite
    container_name: transmite_server-service
    environment:
      CHATNOW_TRANSMITE_MQ_PASSWORD: ${CHATNOW_TRANSMITE_MQ_PASSWORD:?CHATNOW_TRANSMITE_MQ_PASSWORD is required}
    volumes:
      - ./conf/docker/transmite_server.conf:/im/conf/transmite_server.conf
      - ./middle/data/logs:/var/lib/logs:rw
      - ./middle/data/data:/var/lib/data:rw
      - ./entrypoint.sh:/im/bin/entrypoint.sh
    ports:
      - 10004:10004
    restart: always
    depends_on:
      etcd:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
    entrypoint:
      /im/bin/entrypoint.sh -d etcd:2379,redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384,rabbitmq:5672 -c "/im/bin/transmite_server -flagfile=/im/conf/transmite_server.conf -mq_user=chatnow_transmite -redis_seeds=redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384 -rate_limit_user_max=${TRANSMITE_RATE_LIMIT_USER_MAX:-600} -rate_limit_session_max=${TRANSMITE_RATE_LIMIT_SESSION_MAX:-3000}"
  identity_server:
    build: ./identity
    container_name: identity_server-service
    environment:
      CHATNOW_IDENTITY_MYSQL_PASSWORD: ${CHATNOW_IDENTITY_MYSQL_PASSWORD:?CHATNOW_IDENTITY_MYSQL_PASSWORD is required}
      CHATNOW_IDENTITY_SMTP_PASSWORD: ${CHATNOW_IDENTITY_SMTP_PASSWORD:?CHATNOW_IDENTITY_SMTP_PASSWORD is required}
      CHATNOW_JWT_CONFIG: ${CHATNOW_JWT_CONFIG:?CHATNOW_JWT_CONFIG is required}
    volumes:
      - ./conf/docker/identity_server.conf:/im/conf/identity_server.conf
      - ./middle/data/logs:/var/lib/logs:rw
      - ./middle/data/data:/var/lib/data:rw
      - ./entrypoint.sh:/im/bin/entrypoint.sh
    ports:
      - 10003:10003
    restart: always
    depends_on:
      etcd:
        condition: service_healthy
      mysql-init:
        condition: service_completed_successfully
      redis-cluster-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    entrypoint:
      /im/bin/entrypoint.sh -d etcd:2379,mysql:3306,redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384,elasticsearch:9200 -c "/im/bin/identity_server -flagfile=/im/conf/identity_server.conf -mysql_user=chatnow_identity -redis_seeds=redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384"
  presence_server:
    build: ./presence
    container_name: presence_server-service
    volumes:
      - ./conf/docker/presence_server.conf:/im/conf/presence_server.conf
      - ./middle/data/logs:/var/lib/logs:rw
      - ./middle/data/data:/var/lib/data:rw
      - ./entrypoint.sh:/im/bin/entrypoint.sh
    ports:
      - 9050:9050
    restart: always
    depends_on:
      etcd:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    entrypoint:
      /im/bin/entrypoint.sh -d etcd:2379,redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384 -c "/im/bin/presence_server -flagfile=/im/conf/presence_server.conf -redis_seeds=redis-node1:6379,redis-node2:6380,redis-node3:6381,redis-node4:6382,redis-node5:6383,redis-node6:6384"
